simulation:
  t_end_s: 7500.0
  dt_s: 1.0
  output_dir: outputs/dispersion_recovery
  save_plots: true
  stop_on_success: true
  allocation_error_tol: 1.0e-6
  adcs_saturation_limit: 1.0e-3
  control_enabled: true
  guidance_enabled: true

orbit:
  altitude_km: 500.0
  inclination_deg: 51.6
  raan_deg: 0.0
  arg_perigee_deg: 0.0
  true_anomaly_deg: 0.0
  ecc: 0.0

receiver_node:
  mass_kg: 200.0
  area_m2: 0.2
  Cd: 2.2

payload:
  mass_kg: 150.0
  area_m2_min: 0.02
  area_m2_max: 0.2
  Cd: 2.2

initial_relative_state_lvh_m:
  r_m: [0.0, 1000.0, 0.0]
  v_mps: [0.0, 0.0, 0.0]

environment:
  atmosphere:
    model: exponential
    params:
      rho0: 3.0e-12
      h0: 400000.0
      H: 50000.0
      rho_scale: 1.0

guidance:
  use_nominal: true
  method: cw_target
  cw_position_weight: 1.0
  cw_speed_weight: 0.0
  cadence_s:
    COARSE: 300.0
    REFINE: 30.0
    TERMINAL_PREP: 1.0
    TERMINAL: 1.0
  gains:
    COARSE: {kp: 1.0e-6, kd: 2.0e-3}
    REFINE: {kp: 5.0e-6, kd: 5.0e-3}
    TERMINAL_PREP: {kp: 2.0e-5, kd: 1.0e-2}
    TERMINAL: {kp: 5.0e-5, kd: 2.0e-2}
  target_speeds:
    REFINE: 0.20
    TERMINAL_PREP: 0.10
    TERMINAL: 0.05
  speed_gain: 0.2
  r_cor_slowdown_radius_m: 80.0
  r_cor_target_speed_mps: 0.20
  r_cor_speed_gain: 0.5
  max_accel: 5.0e-4

gates:
  thresholds:
    R_ACQ: 250.0
    R_COR: 10.0
    R_PRE: 2.0
    R_LATCH: 0.5
  speed_limits:
    R_COR: {target: 0.20, hard_max: 0.35}
    R_PRE: {target: 0.10, hard_max: 0.20}
    R_LATCH: {target: 0.05, hard_max: 0.10}

medt:
  I_max: 10.0
  L_tether: 1000.0
  eta: 0.5
  safe_modes: [TERMINAL_PREP]

terminal_capture:
  enabled: false
  use_node_thruster: true
  kp: 2.5e-3
  kd: 8.0e-2
  kt: 4.0e-1
  gain_scale_max: 8.0
  max_accel: 5.0e-1
  extra_time_s: 1800.0
  extend_mission: false
  range_margin: 0.2
  v_los_target_cor: 0.15
  v_los_max_cor: 0.25
  v_los_target_pre: 0.07
  v_los_max_pre: 0.12
  v_los_target_latch: 0.03
  v_los_max_latch: 0.06
  brake_safety: 1.5
  cap_scale: 1.0
  cap_scale_pre: 0.9
  cap_scale_latch: 0.9

targeting:
  enabled: true
  method: dv
  cor_entry_lead_s: 300.0
  position_weight: 1.0
  speed_weight: 0.5
  dv0_max_mps: 0.2
  dv0_axis_max_mps: [0.2, 0.2, 0.2]
  dt_max_s: 600.0
  dt_step_s: 10.0

dispersion:
  enabled: true
  r_m: [50.0, 200.0, 20.0]
  v_mps: [0.02, 0.05, 0.01]
  signs_r: [1.0, 1.0, -1.0]
  signs_v: [-1.0, 1.0, 1.0]

debug:
  dual_run: true

mc:
  enabled: true
  runs: 500
  seed: 123
  dt_s: 10.0
  uncertainties:
    cd_sigma: 0.05
    eta_sigma: 0.1
    rho_scale_sigma: 0.2
    initial_pos_sigma_m: 0.0
    initial_vel_sigma_mps: 0.0
